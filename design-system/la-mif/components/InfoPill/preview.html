<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pastilles infos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
.row{--k:1;display:flex;flex-wrap:wrap;gap:12px;padding:16px;align-items:center}
.row .lm-pill{height:36px;padding:0 16px;font-size:12px}
.r1{background:var(--creme)}
.r2{background:var(--bordeaux)}
</style>
</head>
<body>
<div class="row r1">
  <span class="lm-pill lm-pill--charbon">4 avril</span>
  <span class="lm-pill lm-pill--charbon">Nakama</span>
  <span class="lm-pill lm-pill--line" style="color:var(--charbon)">Jeux · Karaoké · DJ sets</span>
</div>
<div class="row r2">
  <span class="lm-pill lm-pill--jaune">21 juin</span>
  <span class="lm-pill lm-pill--creme">Velvet Bar</span>
  <span class="lm-pill lm-pill--line" style="color:var(--creme)">Open air</span>
</div>
</body>
</html>
