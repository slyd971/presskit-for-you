<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LA MIF</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--brand); }
  .deep { fill:var(--deep); }
  .accent { fill:var(--accent); }
  .star { fill:var(--creme); }
  .blk { rx:var(--radius-0); }
  .arm { rx:var(--space-2); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:120px; line-height:.92; letter-spacing:.005em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 3px; font-size:14px; line-height:20px; font-weight:700; letter-spacing:.12em; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      brand (velours) 192×272 bled off the top, the largest · deep (bordeaux; charbon in the Bordeaux theme) 288×192 bled off the right · accent (jaune) 64×64 bled off the top, kept small because yellow is accent-only — ≈38% of 960×288
  arrangement one tall velours slab with a deep slab beside it, bottoms aligned space-4 above the edge, space-2 gutter; the yellow square sits above the deep slab
  pattern     the ✱ from the presskit's "LA MIF C'EST ÇA ✱" band, built from three space-4-tall pills (rx space-2) at 90°/30°/150°, cut in creme into the velours slab — the brand's one pictogram
  scales      sides in space-2 multiples; gutter space-2; bottom margin space-4; blocks radius-0 (square, magazine); arms rx space-2 (half of space-4)
-->
<rect class="brand blk" x="0" y="-16" width="192" height="272" rx="0"/>
<rect class="accent blk" x="208" y="-16" width="64" height="64" rx="0"/>
<rect class="deep blk" x="208" y="64" width="288" height="192" rx="0"/>
<rect class="star arm" x="24" y="112" width="144" height="32" rx="16" transform="rotate(90 96 128)"/>
<rect class="star arm" x="24" y="112" width="144" height="32" rx="16" transform="rotate(30 96 128)"/>
<rect class="star arm" x="24" y="112" width="144" height="32" rx="16" transform="rotate(150 96 128)"/>
</svg>
</div>
<div class="words">
<h1 class="name">LA MIF</h1>
<p class="tag">LA MIF C'EST ÇA</p>
</div>
</div>
</body>
</html>
